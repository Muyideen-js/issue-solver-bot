name: Solver cycle

# One discovery + drain pass, then exit — the opposite of the always-on
# poller/worker, so nothing is billed for idle uptime.
#
# Manual only. The bot normally runs on a local machine (see README), so an
# automatic schedule here would either fail every 15 minutes with no secrets
# set, or run a second solver competing for the same jobs. Re-enable the cron
# below only if this becomes the primary runner.
#
#  schedule:
#    - cron: "*/15 * * * *"
on:
  workflow_dispatch:

# A cycle claims jobs with skip_locked, so overlapping runs are safe, but
# serialising them keeps database usage predictable on a metered free tier.
concurrency:
  group: solver-cycle
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run one solver cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_SOLVER_BOT_TOKEN: ${{ secrets.TELEGRAM_SOLVER_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'deepseek' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PROGRAM_LABELS: ${{ vars.PROGRAM_LABELS }}
          SOLVER_MAX_TURNS: ${{ vars.SOLVER_MAX_TURNS }}
          SOLVER_REPAIR_MAX_TURNS: ${{ vars.SOLVER_REPAIR_MAX_TURNS }}
          SOLVER_MAX_REPAIR_ATTEMPTS: ${{ vars.SOLVER_MAX_REPAIR_ATTEMPTS }}
          SOLVER_CONCURRENCY: ${{ vars.SOLVER_CONCURRENCY || '3' }}
          # Leave the job a few minutes to wind down before timeout-minutes
          # kills it mid-push.
          CYCLE_MAX_SECONDS: "2700"
        run: python -m scripts.run_cycle
