<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Issue Solver Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dashboard/assets/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <span class="brand-mark login-mark">IS</span>
    <h2>Sign in</h2>
    <p class="hint">Open your Issue Solver workspace.</p>
    <input id="username" type="text" placeholder="Username" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <p id="error" class="error hidden"></p>
    <div class="modal-actions">
      <button id="submit" class="btn btn-primary button-block">Sign in</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  const usernameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");
  const errorEl = document.getElementById("error");

  const submitBtn = document.getElementById("submit");
  let busy = false;

  async function submit() {
    if (busy) return;
    busy = true;
    const original = submitBtn.innerHTML;
    submitBtn.disabled = true;
    submitBtn.classList.add("is-busy");
    submitBtn.innerHTML = '<span class="spinner"></span>Signing in';
    errorEl.classList.add("hidden");
    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: usernameInput.value.trim(),
          password: passwordInput.value,
        }),
      });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.detail || "Sign in failed");
      }
      window.location.href = "/dashboard";
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.remove("hidden");
    } finally {
      busy = false;
      submitBtn.disabled = false;
      submitBtn.classList.remove("is-busy");
      submitBtn.innerHTML = original;
    }
  }

  submitBtn.addEventListener("click", submit);
  passwordInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") submit();
  });
  usernameInput.focus();
})();
</script>
</body>
</html>
